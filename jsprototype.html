<!DOCTYPE html>
<html>
<head>
    <title>Gaze Research System - Stable Build</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        #video-hidden { display: none; }
        #info { 
            position: absolute; top: 0; width: 100%; text-align: center; z-index: 100; 
            background: rgba(20, 20, 20, 0.9); padding: 15px 0; font-size: 1.1rem;
            border-bottom: 1px solid #444;
        }
    </style>
</head>
<body>
    <div id="info">Initializing Camera...</div>
    <video id="video-hidden" autoplay playsinline></video>
    <canvas id="output"></canvas>

    <script>
        const video = document.getElementById('video-hidden');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');

        let isCalibrated = false;
        let gazeHistory = []; 
        let currentTarget = 0;
        const targets = [[100,100], [window.innerWidth-100, 100], [window.innerWidth/2, window.innerHeight/2], [100, window.innerHeight-100], [window.innerWidth-100, window.innerHeight-100]];

        async function setup() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            return new Promise(res => video.onloadedmetadata = () => res(video));
        }

        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

        faceMesh.onResults(results => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const mesh = results.multiFaceLandmarks[0];
                const x = ((mesh[468].x + mesh[473].x) / 2) * canvas.width;
                const y = ((mesh[468].y + mesh[473].y) / 2) * canvas.height;

                if (!isCalibrated) {
                    info.innerText = `Calibration Phase: Press 'C' while looking at the Green Dot (${currentTarget+1}/5)`;
                    ctx.fillStyle = '#0f0';
                    ctx.beginPath(); ctx.arc(targets[currentTarget][0], targets[currentTarget][1], 15, 0, 7); ctx.fill();

                    window.onkeydown = (e) => {
                        if (e.key.toLowerCase() === 'c') {
                            currentTarget++;
                            if (currentTarget >= targets.length) isCalibrated = true;
                        }
                    };
                } else {
                    info.innerHTML = "<b>Gaze Tracker Active</b> | Density Heatmap building... | Press 'Q' to Clear";
                    
                    // 1. Add to History
                    gazeHistory.push({x, y});
                    if (gazeHistory.length > 400) gazeHistory.shift();

                    // 2. Draw Heatmap Trails
                    ctx.globalCompositeOperation = 'screen'; 
                    gazeHistory.forEach((point, index) => {
                        let ageRatio = index / gazeHistory.length; 
                        let radius = 10 + (ageRatio * 25);
                        
                        let grad = ctx.createRadialGradient(point.x, point.y, 0, point.x, point.y, radius);
                        grad.addColorStop(0, `rgba(255, ${50 + (200 * ageRatio)}, 0, 0.2)`); 
                        grad.addColorStop(1, 'rgba(0, 0, 255, 0)');
                        
                        ctx.fillStyle = grad;
                        ctx.beginPath(); ctx.arc(point.x, point.y, radius, 0, 7); ctx.fill();
                    });
                    ctx.globalCompositeOperation = 'source-over';

                    // 3. Live Cursor
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.stroke();
                }
            }
        });

        async function start() {
            await setup();
            const camera = new Camera(video, { onFrame: async () => await faceMesh.send({image: video}), width: 1280, height: 720 });
            camera.start();
        }

        window.addEventListener("keydown", (e) => {
            if (e.key.toLowerCase() === 'q') {
                isCalibrated = false; currentTarget = 0; gazeHistory = [];
            }
        });

        start();
    </script>
</body>
</html>
